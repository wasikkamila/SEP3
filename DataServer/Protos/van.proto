syntax = "proto3";

option csharp_namespace = "DataServer";
option java_multiple_files = true;
option java_package = "dk.via.sep3.grpc";
option java_outer_classname = "VanProto";

package van;

// gRPC service for van operations
service VanService {

  // Get available vans for a destination
  rpc GetAvailableVans (GetAvailableVansRequest)
      returns (GetAvailableVansResponse);

  // Assign or change a parcel's van
  rpc AssignParcelToVan (AssignParcelToVanRequest)
      returns (AssignParcelToVanResponse);
}

// Request available vans
message GetAvailableVansRequest {
  string destination = 1;
}

// Return available vans
message GetAvailableVansResponse {
  repeated VanData vans = 1;
}

// Request to assign a parcel to a van
message AssignParcelToVanRequest {
  int32 parcel_id = 1;
  string van_id = 2;
}

// Result of assigning a parcel to a van
message AssignParcelToVanResponse {
  bool success = 1;
  string message = 2;
}

// Van information
message VanData {
  string van_id = 1;
  string destination = 2;
  int32 capacity = 3;
  string route = 4;
}



  
