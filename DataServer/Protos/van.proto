syntax = "proto3";

option csharp_namespace = "DataServer";
option java_multiple_files = true;
option java_package = "dk.via.sep3.grpc";
option java_outer_classname = "VanProto";

package van;

// gRPC service for van operations
service VanService {

  // Get available vans for a destination
  rpc GetAvailableVans (GetAvailableVansRequest) returns (GetAvailableVansResponse);
  
  rpc GetVans (GetVansRequest) returns (GetVansResponse);
  
  rpc GetVanParcelCounts (GetVanParcelCountsRequest) returns (GetVanParcelCountsResponse);
  
}

// Request available vans
message GetAvailableVansRequest 
{
  string destination = 1;
}

// Return available vans
message GetAvailableVansResponse {
  repeated VanData vans = 1;
}

message GetVansRequest{}

message GetVansResponse
{
  repeated VanData vans = 1;
}


message GetVanParcelCountsRequest {}

message GetVanParcelCountsResponse
{
  repeated VanParcelCountData counts = 1;
}





// Van information
message VanData {
  string van_id = 1;
  string destination = 2;
  int32 capacity = 3;
  string route = 4;
}

message VanParcelCountData
{
  int32 van_id = 1;
  string destination = 2;
  int32 capacity = 3;
  int32 parcel_count = 4;
}



  
