syntax = "proto3";

option csharp_namespace = "DataServer";
option java_multiple_files = true;
option java_package = "dk.via.sep3.grpc";
option java_outer_classname = "ParcelProto";

package parcel;

import "google/protobuf/timestamp.proto";

// gRPC service for parcel operations
service ParcelService {
  rpc CreateParcel (SaveParcelRequest) returns (ParcelResponse);
  rpc GetParcelById (GetParcelRequest) returns (ParcelResponse);
}


enum ParcelStatus
{
  REGISTERED = 0;
  DELAYED = 1;
  DISPATCHED = 2;
}

// Details needed to register a parcel
message SaveParcelRequest {
  double volume = 1;
  double weight = 2;
  string destination = 3;
  int32 registered_by_user_id = 4;
}

// Get a parcel by its ID
message GetParcelRequest {
  int32 parcel_id = 1;
}

// Result of a parcel operation
message ParcelResponse {
  bool success = 1;
  string message = 2;
  ParcelData parcel = 3;
}

// Complete parcel information
message ParcelData {
  int32 parcel_id = 1;
  double weight = 3;
  string destination = 4;
  ParcelStatus status = 5;
  google.protobuf.Timestamp registered_at = 6;
  optional int32 van_id = 7;
  int32 registered_by_user_id = 8;
}





  
 
